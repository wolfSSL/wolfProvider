name: Nginx PQC Tests

# Runs the open-quantum-safe oqs-demos nginx demo with wolfProvider swapped in
# for liboqs + oqs-provider, then runs the connection test
# (.github/nginx/test.sh): connect once per quantum-safe
# group and assert ML-DSA (FIPS 204) certificate authentication plus an
# ML-KEM / hybrid (FIPS 203) key exchange.
#
# Only the PQC path is exercised. Each wolfSSL ref runs in 4 modes:
# replace-default and non-replace (wolfProvider loaded via provider.conf), each
# in normal and force-fail. Versioning matches the other PQC workflows: wolfSSL
# latest -stable (PQC floor v5.9.2-stable) and master, against the latest
# OpenSSL 3.x release. nginx is pinned to a fixed release because upstream
# master is unstable and non-reproducible.

on:
  workflow_call:
    inputs:
      wolfssl_refs_json:
        description: "JSON array of wolfssl refs to test; empty = master + latest -stable (pre-PQC-floor refs are dropped)"
        required: false
        type: string
        default: ""
  workflow_dispatch: {}

jobs:
  discover-versions:
    name: Resolve wolfSSL/OpenSSL versions
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      openssl-tag: ${{ steps.set-matrix.outputs.openssl-tag }}
    steps:
      - name: Resolve wolfSSL refs and latest OpenSSL release
        id: set-matrix
        env:
          INPUT_REFS: ${{ inputs.wolfssl_refs_json }}
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags --refs \
              https://github.com/wolfSSL/wolfssl.git 'v*-stable' \
              | awk -F/ '{print $NF}' | sort -V | tail -n 1)
          if [ -z "${LATEST:-}" ]; then
            echo "::error::Could not resolve latest wolfSSL -stable tag"
            exit 1
          fi
          # PQC needs OpenSSL 3.6+, so always build against the latest release.
          OSSL=$(git ls-remote --tags --refs \
              https://github.com/openssl/openssl.git 'openssl-3.*' \
              | awk -F/ '{print $NF}' | grep -E '^openssl-3\.[0-9.]+$' \
              | sort -V | tail -n 1)
          if [ -z "${OSSL:-}" ]; then
            echo "::error::Could not resolve latest OpenSSL release tag"
            exit 1
          fi
          echo "Latest stable wolfSSL: $LATEST"
          echo "Latest OpenSSL: $OSSL"
          echo "openssl-tag=$OSSL" >> "$GITHUB_OUTPUT"
          # Caller can override the ref set (e.g. nightly Wave 2); default is
          # master + latest -stable.
          if [ -n "${INPUT_REFS:-}" ]; then
            REFS=$(printf '%s' "$INPUT_REFS" | jq -r '.[]')
          else
            REFS=$(printf '%s\n%s\n' "master" "$LATEST")
          fi
          # v5.9.2-stable is the first release with the complete PQC interfaces
          # required by wolfProvider. master is always eligible. A
          # pre-floor ref (e.g. v5.8.4-stable from Wave 2) is dropped -- it
          # would just fail the --enable-pqc gate.
          PQC_FLOOR="v5.9.2-stable"
          ELIGIBLE=()
          for ref in $REFS; do
            if [ "$ref" = "master" ]; then
              ELIGIBLE+=("$ref")
            elif [ "$(printf '%s\n%s\n' "$PQC_FLOOR" "$ref" \
                      | sort -V | head -n1)" = "$PQC_FLOOR" ]; then
              ELIGIBLE+=("$ref")
            else
              echo "::notice::Skipping pre-PQC-floor wolfSSL ref $ref (floor $PQC_FLOOR)"
            fi
          done
          if [ ${#ELIGIBLE[@]} -eq 0 ]; then
            REFS_JSON='[]'
          else
            REFS_JSON=$(printf '%s\n' "${ELIGIBLE[@]}" | jq -R . | jq -sc .)
          fi
          echo "Eligible wolfSSL refs: $REFS_JSON"
          # Each eligible wolfSSL ref expands to 4 rows: replace-default and
          # non-replace, each in normal and force-fail anti-test mode. The
          # matrix owns the replace-default and force-fail axes; the test step
          # hands its raw result to check-workflow-result.sh which inverts the
          # force-fail expectation.
          MATRIX=$(jq -nc --argjson refs "$REFS_JSON" '
            def rows($ref; $lbl):
              [ {"replace":true,  "ff":"WOLFPROV_FORCE_FAIL=1",
                 "sfx":" [replace-default] [force-fail]"},
                {"replace":true,  "ff":"", "sfx":" [replace-default]"},
                {"replace":false, "ff":"WOLFPROV_FORCE_FAIL=1",
                 "sfx":" [non-replace] [force-fail]"},
                {"replace":false, "ff":"", "sfx":" [non-replace]"} ]
              | map({"name":($lbl+.sfx), "wolfssl-ref":$ref,
                     "replace":.replace, "force_fail":.ff});
            { include: ( $refs
                | map(rows(.; (if . == "master" then "master"
                               else "stable (" + . + ")" end)))
                | add // [] ) }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  nginx-pqc:
    name: ${{ matrix.name }}
    needs: discover-versions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: ghcr.io/wolfssl/wolfprovider-test-deps:bookworm
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}
    steps:
      - name: Checkout wolfProvider
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install nginx build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpcre3-dev zlib1g-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build wolfProvider
        run: |
          OPENSSL_TAG=${{ needs.discover-versions.outputs.openssl-tag }} \
          WOLFSSL_TAG=${{ matrix.wolfssl-ref }} \
            ./scripts/build-wolfprovider.sh --enable-pqc \
            ${{ matrix.replace && '--replace-default' || '' }}

      - name: Build nginx 1.28.0
        run: |
          wget -q https://nginx.org/download/nginx-1.28.0.tar.gz
          tar -zxf nginx-1.28.0.tar.gz
          cd nginx-1.28.0
          ./configure --prefix=/opt/nginx --with-http_ssl_module \
            --with-cc-opt="-I$GITHUB_WORKSPACE/openssl-install/include" \
            --with-ld-opt="-L$GITHUB_WORKSPACE/openssl-install/lib -L$GITHUB_WORKSPACE/openssl-install/lib64 -Wl,-rpath,$GITHUB_WORKSPACE/openssl-install/lib -Wl,-rpath,$GITHUB_WORKSPACE/openssl-install/lib64 -Wl,-rpath,$GITHUB_WORKSPACE/wolfprov-install/lib -Wl,-rpath,$GITHUB_WORKSPACE/wolfssl-install/lib"
          make -j"$(nproc)"
          make install

      - name: Configure quantum-safe nginx
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/wolfprov-install/lib:${{ github.workspace }}/wolfssl-install/lib:${{ github.workspace }}/openssl-install/lib:${{ github.workspace }}/openssl-install/lib64
          OPENSSL_CONF: ${{ matrix.replace && format('{0}/openssl-install/ssl/openssl.cnf', github.workspace) || format('{0}/provider.conf', github.workspace) }}
          OPENSSL_MODULES: ${{ github.workspace }}/wolfprov-install/lib
        run: |
          cp .github/nginx/nginx.conf /opt/nginx/conf/nginx.conf
          mkdir -p /opt/nginx/pki /opt/nginx/cacert /opt/nginx/logs /opt/nginx/html
          echo "wolfProvider quantum-safe nginx" > /opt/nginx/html/index.html
          O="$GITHUB_WORKSPACE/openssl-install/bin/openssl"
          "$O" req -x509 -new -newkey ML-DSA-65 -nodes \
            -keyout /opt/nginx/cacert/CA.key \
            -out /opt/nginx/cacert/CA.crt \
            -subj "/CN=wolfProvider PQC CA" -days 365 \
            -addext basicConstraints=critical,CA:TRUE \
            -addext keyUsage=critical,keyCertSign
          "$O" genpkey -algorithm ML-DSA-65 \
            -out /opt/nginx/pki/server.key
          "$O" req -new -key /opt/nginx/pki/server.key \
            -subj "/CN=oqs-nginx" \
            -addext subjectAltName=DNS:localhost \
            -out /opt/nginx/server.csr
          "$O" x509 -req -in /opt/nginx/server.csr \
            -CA /opt/nginx/cacert/CA.crt \
            -CAkey /opt/nginx/cacert/CA.key -CAcreateserial \
            -days 365 -copy_extensions copy \
            -out /opt/nginx/pki/server.crt

      # Run the connection test against the server. In normal
      # mode every quantum-safe group must negotiate with an ML-DSA verified
      # chain; in force-fail mode wolfProvider fails every operation so the
      # handshakes break and check-workflow-result.sh inverts that to a pass,
      # proving wolfProvider genuinely served the PQC crypto.
      - name: Run oqs-demos nginx PQC connection test
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/wolfprov-install/lib:${{ github.workspace }}/wolfssl-install/lib:${{ github.workspace }}/openssl-install/lib:${{ github.workspace }}/openssl-install/lib64
          OPENSSL_CONF: ${{ matrix.replace && format('{0}/openssl-install/ssl/openssl.cnf', github.workspace) || format('{0}/provider.conf', github.workspace) }}
          OPENSSL_MODULES: ${{ github.workspace }}/wolfprov-install/lib
          WOLFPROV_ROOT: ${{ github.workspace }}
        run: |
          set +e
          export ${{ matrix.force_fail || 'WOLFPROV_NOOP=1' }}
          bash .github/nginx/test.sh 2>&1 | tee nginx-pqc.log
          TEST_RESULT=${PIPESTATUS[0]}
          $GITHUB_WORKSPACE/.github/scripts/check-workflow-result.sh \
            $TEST_RESULT "${{ matrix.force_fail }}" nginx-pqc
