name: Static Analysis

on:
  workflow_call: {}
  workflow_dispatch: {}

# run-scoped: a reusable workflow's group keys off the caller, so a shared
# group would let one nightly run cancel another's static analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cppcheck:
    name: cppcheck Static Analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/wolfssl/wolfprovider-test-deps:bookworm
      env:
        DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 30
    steps:
      - name: Checkout wolfProvider
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache build dependencies
        id: deps
        uses: ./.github/actions/oras-build-deps
        with:
          variant: static
          openssl_ref: openssl-3.5.4
          wolfssl_ref: master
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dependencies (OpenSSL and wolfSSL)
        run: |
          OPENSSL_TAG=openssl-3.5.4 WOLFSSL_TAG=master ./scripts/build-wolfprovider.sh 2>&1 | tail -100 || true
          # We only need the build to succeed enough to have headers available

      - name: Push build dependencies
        uses: ./.github/actions/oras-build-deps-push
        with:
          registry: ${{ steps.deps.outputs.registry }}
          openssl_install_tag: ${{ steps.deps.outputs.openssl_install_tag }}
          wolfssl_install_tag: ${{ steps.deps.outputs.wolfssl_install_tag }}
          openssl_hit: ${{ steps.deps.outputs.openssl_hit }}
          wolfssl_hit: ${{ steps.deps.outputs.wolfssl_hit }}

      - name: Generate configure script
        run: |
          ./autogen.sh || true

      - name: Configure to generate config.h
        run: |
          OPENSSL_INSTALL_DIR="$PWD/openssl-install"
          WOLFSSL_INSTALL_DIR="$PWD/wolfssl-install"
          
          # Configure to generate config.h (needed for cppcheck)
          ./configure \
            --with-openssl="$OPENSSL_INSTALL_DIR" \
            --with-wolfssl="$WOLFSSL_INSTALL_DIR" \
            --prefix="$PWD/wolfprov-install" \
            >/dev/null 2>&1 || true

      - name: Run cppcheck
        run: |
          # Configure include paths for cppcheck
          OPENSSL_INC="$PWD/openssl-install/include"
          WOLFSSL_INC="$PWD/wolfssl-install/include"
          WOLFPROV_INC="$PWD/include"

          # Under -j, cppcheck runs its whole-program checks only with a build dir
          rm -rf cppcheck-build
          mkdir cppcheck-build

          # Run cppcheck on source files only (tests can be analyzed separately if needed)
          # The *_MAX values stand in for <limits.h>, which wolfSSL's sp_int.h needs.
          # cppcheck 2.10 cannot evaluate __has_include(); library #ifdefs add no configurations.
          # cppcheck's own exit status goes to cppcheck-rc.txt; the pipeline status is tee's.
          rm -f cppcheck-rc.txt
          { cppcheck \
            --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --force \
            --error-exitcode=0 \
            -I "$OPENSSL_INC" \
            -I "$WOLFSSL_INC" \
            -I "$WOLFPROV_INC" \
            --config-exclude="$OPENSSL_INC" \
            --config-exclude="$WOLFSSL_INC" \
            -DUCHAR_MAX=255 \
            -DUSHRT_MAX=65535 \
            -DUINT_MAX=4294967295U \
            -DULONG_MAX=18446744073709551615UL \
            -DULLONG_MAX=18446744073709551615ULL \
            -U__has_include \
            -j "$(nproc)" \
            --cppcheck-build-dir=cppcheck-build \
            --platform=unix64 \
            src/ 2>&1 || echo $? > cppcheck-rc.txt; } | tee cppcheck-output.txt || true

          # Display output (filter out progress)
          grep -v "^Checking " cppcheck-output.txt | \
            grep -v "^[0-9]*/[0-9]* files checked" | \
            grep -v "^nofile:0:0: information:" || true

          # Findings do not change the exit status (--error-exitcode=0), so non-zero
          # means cppcheck itself failed, e.g. crashed before checking every file
          CPPCHECK_RC=$(cat cppcheck-rc.txt 2>/dev/null || echo 0)
          if [ "$CPPCHECK_RC" -ne 0 ]; then
            echo "cppcheck exited with status $CPPCHECK_RC"
            exit 1
          fi

          # Count errors and warnings (count lines with error:/warning: that are actual issues)
          # Use wc -l for more reliable counting, and strip whitespace
          ERROR_COUNT=$(grep -E "^src/.*:[0-9]+:[0-9]+:.*error:" cppcheck-output.txt 2>/dev/null | wc -l | tr -d '[:space:]' || echo "0")
          WARNING_COUNT=$(grep -E "^src/.*:[0-9]+:[0-9]+:.*warning:" cppcheck-output.txt 2>/dev/null | wc -l | tr -d '[:space:]' || echo "0")
          
          # Ensure we have valid integers (default to 0 if empty)
          ERROR_COUNT=${ERROR_COUNT:-0}
          WARNING_COUNT=${WARNING_COUNT:-0}
          
          echo "cppcheck found $ERROR_COUNT errors and $WARNING_COUNT warnings"
          
          # Fail if any file had no valid configuration, i.e. was not analysed
          NOT_ANALYZED=$(grep "\[noValidConfiguration\]" cppcheck-output.txt | cut -d: -f1 | sort -u)
          if [ -n "$NOT_ANALYZED" ]; then
            echo "cppcheck could not analyse:"
            echo "$NOT_ANALYZED"
            exit 1
          fi

          # Fail only if critical errors found (adjust threshold as needed)
          if [ "${ERROR_COUNT}" -gt 0 ] 2>/dev/null; then
            echo "cppcheck found errors"
            exit 1
          fi

      - name: Upload cppcheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: cppcheck-output.txt
          retention-days: 7

  scan-build:
    name: clang Static Analyzer (scan-build)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/wolfssl/wolfprovider-test-deps:bookworm
      env:
        DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 45
    steps:
      - name: Checkout wolfProvider
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache build dependencies
        id: deps
        uses: ./.github/actions/oras-build-deps
        with:
          variant: static
          openssl_ref: openssl-3.5.4
          wolfssl_ref: master
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dependencies (OpenSSL and wolfSSL)
        run: |
          OPENSSL_TAG=openssl-3.5.4 WOLFSSL_TAG=master ./scripts/build-wolfprovider.sh 2>&1 | tail -100 || true

      - name: Push build dependencies
        uses: ./.github/actions/oras-build-deps-push
        with:
          registry: ${{ steps.deps.outputs.registry }}
          openssl_install_tag: ${{ steps.deps.outputs.openssl_install_tag }}
          wolfssl_install_tag: ${{ steps.deps.outputs.wolfssl_install_tag }}
          openssl_hit: ${{ steps.deps.outputs.openssl_hit }}
          wolfssl_hit: ${{ steps.deps.outputs.wolfssl_hit }}

      - name: Generate configure script
        run: |
          ./autogen.sh

      - name: Configure project for scan-build
        run: |
          OPENSSL_INSTALL_DIR="$PWD/openssl-install"
          WOLFSSL_INSTALL_DIR="$PWD/wolfssl-install"
          
          # Configure with clang (scan-build will wrap it later)
          CC=clang ./configure \
            --with-openssl="$OPENSSL_INSTALL_DIR" \
            --with-wolfssl="$WOLFSSL_INSTALL_DIR" \
            --prefix="$PWD/wolfprov-install"

      - name: Build library with scan-build
        run: |
          # Clean any previous build artifacts
          make clean || true
          
          # Build only the library with scan-build wrapping clang
          # scan-build intercepts compiler calls, so we need to ensure CC is set to clang
          # Use --use-cc and --use-c++ to explicitly tell scan-build which compiler to wrap
          scan-build -o scan-build-output \
            --use-cc=clang \
            --use-c++=clang++ \
            make -j$(nproc) CC=clang libwolfprov.la 2>&1 | tee scan-build-log.txt || true
          
          # scan-build returns 0 even if build fails, so we check exit status explicitly
          echo "Build completed (scan-build may have reports even if build partially failed)"

      - name: Check scan-build results
        run: |
          # Find the latest scan-build report directory
          REPORT_DIR=$(find scan-build-output -maxdepth 1 -type d -name "scan-build-*" | sort -r | head -1)
          
          if [ -z "$REPORT_DIR" ] || [ ! -d "$REPORT_DIR" ]; then
            echo "No scan-build report directory found"
            exit 0
          fi
          
          # Count bugs found
          BUG_COUNT=$(find "$REPORT_DIR" -name "*.html" | wc -l)
          echo "scan-build found $BUG_COUNT potential issues"
          
          # Display summary
          if [ -f "$REPORT_DIR/index.html" ]; then
            echo "View detailed report in scan-build-output/index.html"
            # Extract text summary if possible
            grep -o '<title>.*</title>' "$REPORT_DIR/index.html" || true
          fi
          
          # Fail if critical bugs found (adjust threshold as needed)
          if [ "$BUG_COUNT" -gt 50 ]; then
            echo "Too many issues found by scan-build"
            exit 1
          fi

      - name: Upload scan-build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-results
          path: scan-build-output/
          retention-days: 7

  infer:
    name: Facebook Infer Static Analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/wolfssl/wolfprovider-test-deps:bookworm
      env:
        DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 60
    steps:
      - name: Checkout wolfProvider
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Infer
        run: |
          # Infer ships as a ~100MB tarball - left outside the test-deps
          # image to keep the image small. opam (its OCaml dependency) is
          # baked into the image.
          VERSION=1.1.0
          cd /tmp
          wget https://github.com/facebook/infer/releases/download/v${VERSION}/infer-linux64-v${VERSION}.tar.xz
          tar xf infer-linux64-v${VERSION}.tar.xz
          mv infer-linux64-v${VERSION} /opt/infer
          ln -sf /opt/infer/bin/infer /usr/local/bin/infer

      - name: Cache build dependencies
        id: deps
        uses: ./.github/actions/oras-build-deps
        with:
          variant: static
          openssl_ref: openssl-3.5.4
          wolfssl_ref: master
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dependencies (OpenSSL and wolfSSL)
        run: |
          OPENSSL_TAG=openssl-3.5.4 WOLFSSL_TAG=master ./scripts/build-wolfprovider.sh 2>&1 | tail -100 || true

      - name: Push build dependencies
        uses: ./.github/actions/oras-build-deps-push
        with:
          registry: ${{ steps.deps.outputs.registry }}
          openssl_install_tag: ${{ steps.deps.outputs.openssl_install_tag }}
          wolfssl_install_tag: ${{ steps.deps.outputs.wolfssl_install_tag }}
          openssl_hit: ${{ steps.deps.outputs.openssl_hit }}
          wolfssl_hit: ${{ steps.deps.outputs.wolfssl_hit }}

      - name: Generate configure script
        run: |
          ./autogen.sh

      - name: Configure project
        run: |
          OPENSSL_INSTALL_DIR="$PWD/openssl-install"
          WOLFSSL_INSTALL_DIR="$PWD/wolfssl-install"
          
          ./configure \
            --with-openssl="$OPENSSL_INSTALL_DIR" \
            --with-wolfssl="$WOLFSSL_INSTALL_DIR" \
            --prefix="$PWD/wolfprov-install" \
            CC=clang

      - name: Clean build for Infer
        run: |
          make clean || true
          rm -rf infer-out

      - name: Run Infer analysis
        run: |
          # Run infer on the build (it wraps the compilation)
          # Build only the library to avoid test compilation issues
          # Explicitly set CC=clang for make
          # infer's own exit status goes to infer-rc.txt; the pipeline status is tee's.
          rm -f infer-rc.txt
          { infer run -- make -j$(nproc) CC=clang libwolfprov.la 2>&1 || echo $? > infer-rc.txt; } | tee infer-log.txt || true

          INFER_RC=$(cat infer-rc.txt 2>/dev/null || echo 0)
          if [ "$INFER_RC" -ne 0 ]; then
            echo "infer exited with status $INFER_RC"
            exit 1
          fi

          # Fail if infer did not analyse every source file
          SRC_COUNT=$(ls src/*.c | wc -l)
          ANALYSED=$(sed -n 's/^Found \([0-9]*\) source files to analyze.*/\1/p' infer-log.txt)
          if [ "$ANALYSED" != "$SRC_COUNT" ]; then
            echo "infer analysed ${ANALYSED:-0} of $SRC_COUNT source files"
            exit 1
          fi

          # infer run writes report.txt and report.json (one entry per issue)
          if [ ! -f infer-out/report.txt ] || [ ! -f infer-out/report.json ]; then
            echo "infer wrote no report"
            exit 1
          fi
          echo "=== Infer Analysis Summary ==="
          cat infer-out/report.txt

          ISSUE_COUNT=$(jq length infer-out/report.json)
          echo "Infer found $ISSUE_COUNT issues"

          # Fail if too many issues (adjust threshold as needed)
          if [ "$ISSUE_COUNT" -gt 100 ]; then
            echo "Too many issues found by Infer"
            exit 1
          fi

      - name: Upload Infer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infer-results
          path: |
            infer-out/
            infer-log.txt
          retention-days: 7
          if-no-files-found: ignore
