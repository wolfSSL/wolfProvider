name: Discover wolfSSL + OpenSSL versions

on:
  workflow_call:
    inputs:
      resolve_fips:
        description: 'Resolve FIPS Ready bundle versions too. Only the FIPS workflows set this; every other caller skips the FIPS work it never uses.'
        required: false
        default: false
        type: boolean
    outputs:
      wolfssl_ref:
        description: 'Plain string, actual wolfSSL version in the wolfprov nonfips .deb on ghcr (e.g. v5.8.4-stable)'
        value: ${{ jobs.discover.outputs.wolfssl_ref }}
      wolfssl_ref_array:
        description: 'JSON array of master + actual .deb wolfssl ref for matrix use'
        value: ${{ jobs.discover.outputs.wolfssl_ref_array }}
      wolfssl_latest_ref:
        description: 'Plain string, latest v*-stable tag upstream wolfssl has'
        value: ${{ jobs.discover.outputs.wolfssl_latest_ref }}
      wolfssl_latest_ref_array:
        description: 'JSON array form: master + latest upstream stable'
        value: ${{ jobs.discover.outputs.wolfssl_latest_ref_array }}
      openssl_ref:
        description: 'Plain string. Bookworm stock OpenSSL (matches the wolfprov .deb).'
        value: ${{ jobs.discover.outputs.openssl_ref }}
      openssl_ref_array:
        description: 'JSON array form of openssl_ref'
        value: ${{ jobs.discover.outputs.openssl_ref_array }}
      openssl_latest_ref:
        description: 'Plain string, latest upstream openssl-3.x.y release tag (e.g. openssl-3.6.2)'
        value: ${{ jobs.discover.outputs.openssl_latest_ref }}
      openssl_latest_ref_array:
        description: 'JSON array form of openssl_latest_ref'
        value: ${{ jobs.discover.outputs.openssl_latest_ref_array }}
      openssl_all_releases_array:
        description: 'JSON array of every upstream openssl-3.X.Y release tag, sorted ascending. Used by openssl-version.yml so the sweep tracks upstream automatically.'
        value: ${{ jobs.discover.outputs.openssl_all_releases_array }}
      fips_ready_latest:
        description: 'Plain string, newest hosted FIPS Ready bundle version (e.g. 5.9.2)'
        value: ${{ jobs.discover.outputs.fips_ready_latest }}
      fips_ready_pr_array:
        description: 'JSON array of FIPS Ready bundle versions for PR runs: the back-compat anchors plus the newest'
        value: ${{ jobs.discover.outputs.fips_ready_pr_array }}
      fips_ready_all_array:
        description: 'JSON array of every hosted FIPS Ready bundle version at or above the floor. Used by the nightly sweep.'
        value: ${{ jobs.discover.outputs.fips_ready_all_array }}
      fips_ready_resolved:
        description: '"true" if FIPS Ready bundle discovery succeeded, "false" if the outputs above are a degraded floor-only fallback. FIPS-specific callers must fail on "false" rather than silently testing a stale matrix.'
        value: ${{ jobs.discover.outputs.fips_ready_resolved }}

jobs:
  discover:
    name: Resolve wolfSSL + OpenSSL refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      wolfssl_ref: ${{ steps.resolve.outputs.wolfssl_ref }}
      wolfssl_ref_array: ${{ steps.resolve.outputs.wolfssl_ref_array }}
      wolfssl_latest_ref: ${{ steps.resolve.outputs.wolfssl_latest_ref }}
      wolfssl_latest_ref_array: ${{ steps.resolve.outputs.wolfssl_latest_ref_array }}
      openssl_ref: ${{ steps.resolve.outputs.openssl_ref }}
      openssl_ref_array: ${{ steps.resolve.outputs.openssl_ref_array }}
      openssl_latest_ref: ${{ steps.resolve.outputs.openssl_latest_ref }}
      openssl_latest_ref_array: ${{ steps.resolve.outputs.openssl_latest_ref_array }}
      openssl_all_releases_array: ${{ steps.resolve.outputs.openssl_all_releases_array }}
      fips_ready_latest: ${{ steps.resolve.outputs.fips_ready_latest }}
      fips_ready_pr_array: ${{ steps.resolve.outputs.fips_ready_pr_array }}
      fips_ready_all_array: ${{ steps.resolve.outputs.fips_ready_all_array }}
      fips_ready_resolved: ${{ steps.resolve.outputs.fips_ready_resolved }}
    steps:
      - name: Checkout wolfProvider
        if: inputs.resolve_fips
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ORAS (best-effort)
        run: |
          set -uo pipefail
          ORAS_VERSION="1.2.2"
          ORAS_CHECKSUM="bff970346470e5ef888e9f2c0bf7f8ee47283f5a45207d6e7a037da1fb0eae0d"
          tgz="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          ok=""
          for attempt in 1 2 3 4 5; do
            if curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${tgz}"; then ok=1; break; fi
            echo "ORAS download attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          # Best-effort: if oras can't be fetched/verified, the .deb probe below
          # simply misses and falls back to the upstream latest tag.
          if [ -z "$ok" ]; then
            echo "::warning::ORAS download failed after retries; version probe falls back to upstream latest"
            exit 0
          fi
          if ! echo "${ORAS_CHECKSUM}  ${tgz}" | sha256sum -c -; then
            echo "::warning::ORAS checksum mismatch; skipping install"
            rm -f "$tgz"; exit 0
          fi
          tar xzf "$tgz" oras
          sudo mv oras /usr/local/bin/oras
          rm -f "$tgz"
          oras version

      - name: Login to ghcr.io (best-effort)
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Resolve versions
        id: resolve
        env:
          RESOLVE_FIPS: ${{ inputs.resolve_fips }}
        run: |
          set -euo pipefail

          # Retry wrapper for flaky external calls (git ls-remote, Docker Hub)
          # so a single network blip does not fail the whole shared job. Echoes
          # the first non-empty result from up to 3 attempts.
          retry_out() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$("$@" 2>/dev/null) && [ -n "$out" ]; then
                printf '%s' "$out"
                return 0
              fi
              echo "retry $attempt/3: '$*' failed; retrying..." >&2
              sleep $((attempt * 5))
            done
            return 1
          }
          ls_wolfssl_stable() {
            git ls-remote --tags --refs https://github.com/wolfSSL/wolfssl.git 'v*-stable' \
              | awk -F/ '{print $NF}' | sort -V | tail -n 1
          }
          probe_ossl_bookworm() {
            docker run --rm debian:bookworm sh -c \
              'apt-get update -qq >/dev/null 2>&1 && apt-cache madison openssl | head -1' \
              | awk '{print $3}'
          }
          ls_openssl_all() {
            git ls-remote --tags --refs https://github.com/openssl/openssl.git 'openssl-3.*' \
              | awk -F/ '{print $NF}' \
              | grep -E '^openssl-3\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | awk -v floor="$OSSL_FLOOR" '$0 == floor {p=1} p'
          }

          # wolfSSL: probe the .deb on ghcr.io.
          WOLFSSL_DEB_REF=""
          PROBE_DIR=$(mktemp -d)
          if oras pull ghcr.io/wolfssl/wolfprovider/debs:nonfips -o "$PROBE_DIR" >/dev/null 2>&1; then
            DEB_FILE=$(find "$PROBE_DIR" -name 'libwolfssl_*.deb' | head -1)
            if [ -n "${DEB_FILE:-}" ]; then
              # libwolfssl_5.8.4+commercial.fips.linuxv5.2.4+1_amd64.deb
              # -> 5.8.4
              VER=$(basename "$DEB_FILE" \
                | sed -E 's|^libwolfssl_([0-9]+\.[0-9]+\.[0-9]+).*|\1|')
              if [ -n "$VER" ]; then
                WOLFSSL_DEB_REF="v${VER}-stable"
              fi
            fi
          fi
          rm -rf "$PROBE_DIR"

          # wolfSSL: latest upstream -stable tag.
          WOLFSSL_LATEST=$(retry_out ls_wolfssl_stable) || true
          if [ -z "${WOLFSSL_LATEST:-}" ]; then
            echo "::error::Could not resolve latest wolfSSL -stable tag after retries"
            exit 1
          fi

          # Fall back if the .deb probe failed.
          if [ -z "${WOLFSSL_DEB_REF:-}" ]; then
            echo "::warning::Could not probe wolfssl version from ghcr .deb; falling back to upstream latest ($WOLFSSL_LATEST). Matrix label may not match the actual installed library."
            WOLFSSL_DEB_REF="$WOLFSSL_LATEST"
          fi

          # OpenSSL: Bookworm stock (matches the wolfprov .deb).
          OSSL_RAW=$(retry_out probe_ossl_bookworm) || true
          if [ -z "${OSSL_RAW:-}" ]; then
            echo "::error::Could not resolve Bookworm OpenSSL version after retries"
            exit 1
          fi
          OSSL=$(echo "$OSSL_RAW" | sed 's/-.*//')

          # OpenSSL: all upstream release tags >= floor.
          # Floor 3.0.6 -- 3.0.3-3.0.5 have an ECX EVP_PKEY_cmp bug.
          OSSL_FLOOR="openssl-3.0.6"
          OSSL_ALL=$(retry_out ls_openssl_all) || true
          if [ -z "${OSSL_ALL:-}" ]; then
            echo "::error::Could not resolve upstream OpenSSL release tags (floor=$OSSL_FLOOR) after retries"
            exit 1
          fi
          OSSL_ALL_JSON=$(printf '%s\n' "$OSSL_ALL" | jq -R . | jq -s -c .)
          OSSL_LATEST=$(echo "$OSSL_ALL" | tail -n 1)

          # FIPS Ready bundle versions are the tags published to ghcr by the
          # FIPS Ready publish job (nightly-fips-ready.yml), so this lists ghcr
          # tags instead of scraping wolfssl.com. Only the FIPS workflows opt in
          # through resolve_fips; the ~40 other callers skip it entirely and
          # never carry FIPS outputs they don't use.
          if [ "${RESOLVE_FIPS:-false}" = "true" ]; then
            FR_FLOOR="5.8.2"
            FR_OK=true
            FR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            FR_REPO="ghcr.io/$FR_OWNER/wolfprovider/fips-ready"
            FLOOR_KEY=$(printf '%s' "$FR_FLOOR" | awk -F. '{printf "%05d.%05d.%05d",$1,$2,$3}')
            FR_ALL=$(oras repo tags "$FR_REPO" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | awk -F. -v fk="$FLOOR_KEY" \
                  '{k=sprintf("%05d.%05d.%05d",$1,$2,$3); if (k>=fk) print k" "$0}' \
              | sort | awk '{print $2}') || true
            if [ -z "${FR_ALL:-}" ]; then
              # ghcr not seeded yet (bootstrap, or a fork with no publish run):
              # fall back to the wolfssl.com list so the matrix is still real.
              # The build step falls back to a verified download the same way.
              echo "::warning::No FIPS Ready bundle tags in $FR_REPO; falling back to the wolfssl.com list until the publish job seeds ghcr"
              FR_ALL=$(./scripts/fetch-fips-ready.sh --list --floor "$FR_FLOOR") || true
            fi
            if [ -z "${FR_ALL:-}" ]; then
              # Neither ghcr nor wolfssl.com yielded anything: refuse to report
              # green on a near-empty matrix.
              echo "::warning::Could not resolve any FIPS Ready bundles; falling back to $FR_FLOOR (FIPS callers will fail this run)"
              FR_ALL="$FR_FLOOR"
              FR_OK=false
            fi
            FR_ALL_JSON=$(printf '%s\n' "$FR_ALL" | jq -R . | jq -s -c .)
            FR_LATEST=$(echo "$FR_ALL" | tail -n 1)
            # 5.8.4 and 5.9.1 are the back-compat anchors: the last two bundles
            # where --enable-fips=ready still meant FIPS v7, which 5.9.2 moved to v8.
            # Intersected with the hosted set so a delisted anchor drops out.
            FR_PR_JSON=$(printf '%s\n' "5.8.4" "5.9.1" "$FR_LATEST" | jq -R . \
              | jq -s -c --argjson all "$FR_ALL_JSON" \
                  '[.[] | select(. as $v | $all | index($v))] | unique_by(split(".")|map(tonumber))')
            if [ "$FR_PR_JSON" = "[]" ]; then
              FR_PR_JSON="[\"$FR_LATEST\"]"
            fi
            echo "FIPS Ready latest bundle:           $FR_LATEST"
            echo "FIPS Ready PR set:                  $FR_PR_JSON"
            echo "FIPS Ready full set (floor $FR_FLOOR):  $FR_ALL_JSON"
          fi

          echo "wolfSSL .deb ref (actual ghcr deb):  $WOLFSSL_DEB_REF"
          echo "wolfSSL upstream latest -stable:    $WOLFSSL_LATEST"
          echo "OpenSSL Bookworm stock:             openssl-$OSSL (raw: $OSSL_RAW)"
          echo "OpenSSL upstream latest:            $OSSL_LATEST"
          echo "OpenSSL upstream releases tracked:  $(echo "$OSSL_ALL" | wc -l) tags"

          {
            echo "wolfssl_ref=$WOLFSSL_DEB_REF"
            echo "wolfssl_ref_array=[\"master\",\"$WOLFSSL_DEB_REF\"]"
            echo "wolfssl_latest_ref=$WOLFSSL_LATEST"
            # v5.8.4-stable: supported back-compat line, always in PR matrix.
            echo "wolfssl_latest_ref_array=[\"master\",\"$WOLFSSL_LATEST\",\"v5.8.4-stable\"]"
            echo "openssl_ref=openssl-$OSSL"
            echo "openssl_ref_array=[\"openssl-$OSSL\"]"
            echo "openssl_latest_ref=$OSSL_LATEST"
            echo "openssl_latest_ref_array=[\"$OSSL_LATEST\"]"
            echo "openssl_all_releases_array=$OSSL_ALL_JSON"
            if [ "${RESOLVE_FIPS:-false}" = "true" ]; then
              echo "fips_ready_latest=$FR_LATEST"
              echo "fips_ready_pr_array=$FR_PR_JSON"
              echo "fips_ready_all_array=$FR_ALL_JSON"
              echo "fips_ready_resolved=$FR_OK"
            fi
          } >> "$GITHUB_OUTPUT"
