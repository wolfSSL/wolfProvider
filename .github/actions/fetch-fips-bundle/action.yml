name: Fetch FIPS Ready bundle
description: Pull a wolfSSL FIPS Ready bundle from ghcr (published by the FIPS Ready publish job) and expose its extracted path via FIPS_BUNDLE_PATH.

inputs:
  version:
    description: Bundle version, e.g. 5.9.2.
    required: true
  github_token:
    description: Token for ghcr login.
    required: true

outputs:
  bundle_path:
    description: Path to the extracted bundle directory.
    value: ${{ steps.pull.outputs.bundle_path }}

runs:
  using: composite
  steps:
    - name: Install ORAS (if needed)
      shell: bash
      run: |
        set -euo pipefail
        if command -v oras >/dev/null 2>&1 || [ -x "$GITHUB_WORKSPACE/.bin/oras" ]; then
          exit 0
        fi
        ORAS_VERSION="1.2.2"
        ORAS_CHECKSUM="bff970346470e5ef888e9f2c0bf7f8ee47283f5a45207d6e7a037da1fb0eae0d"
        tgz="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${tgz}"
        echo "${ORAS_CHECKSUM}  ${tgz}" | sha256sum -c -
        mkdir -p "$GITHUB_WORKSPACE/.bin"
        tar xzf "$tgz" -C "$GITHUB_WORKSPACE/.bin/" oras
        rm -f "$tgz"

    - name: Pull bundle from ghcr
      id: pull
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        export PATH="$GITHUB_WORKSPACE/.bin:$PATH"
        echo "$GH_TOKEN" | oras login --username "${{ github.actor }}" \
          --password-stdin ghcr.io || true
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        VER="${{ inputs.version }}"
        DIR="$GITHUB_WORKSPACE/wolfssl-$VER-gplv3-fips-ready"
        REF="ghcr.io/$OWNER/wolfprovider/fips-ready:$VER"
        # Prefer the ghcr copy (integrity from the registry digest). Until the
        # publish job has seeded ghcr, fall back to a verified download from
        # wolfssl.com so the build is never blocked on the bootstrap.
        if "$GITHUB_WORKSPACE/scripts/oras-build-deps.sh" pull "$REF" "$DIR"; then
          echo "Pulled FIPS bundle from ghcr: $DIR"
        else
          echo "$VER not in ghcr ($REF); falling back to a verified wolfssl.com download"
          DIR=$("$GITHUB_WORKSPACE/scripts/fetch-fips-ready.sh" "$VER" \
            --dest "$GITHUB_WORKSPACE")
        fi
        echo "FIPS_BUNDLE_PATH=$DIR" >> "$GITHUB_ENV"
        echo "bundle_path=$DIR" >> "$GITHUB_OUTPUT"
